name: NFX-Pad build

# Dedicated pipeline for the NFX-Pad feature branches. Mirrors the steps of the upstream
# staging workflow (same JDK / NDK / SDK / Cython setup) but builds a single flavour and
# names the artifact after the app, so a test APK is one click away.
#
# Signing: no repository secret is required. LOCAL_PROPERTIES is used when present,
# otherwise build.gradle falls back to the RELEASE_* values in gradle.properties.

on:
  push:
    branches:
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/nfxp.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Assemble normal staging
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Verify the signing keystore
        # Cheap preflight: a bad alias or password used to cost a full 40 minute build before failing
        # in packageNormalStaging. The project key is used whenever no LOCAL_PROPERTIES secret exists.
        run: |
          if [ -n "${{ secrets.LOCAL_PROPERTIES }}" ]; then
            echo "LOCAL_PROPERTIES is set, the build will use the supplied keystore credentials"
          else
            keytool -list -keystore TMessagesProj/nfxp.keystore -storepass nfxp-nfpad -alias nfxp
          fi
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          # ndk must match ndkVersion in the root build.gradle
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Set up Python (Chaquopy bridge source build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install Cython (Chaquopy bridge source build)
        run: pip install Cython==3.0.11
      - name: Configure Android SDK Path and API credentials
        # The credentials go into local.properties, which is where build.gradle reads them from
        # (local.properties is gitignored and lives only on this runner for the length of the job).
        # Environment variables are not used: a reused Gradle daemon would answer with the
        # environment it started with, mixing an id from one run with a hash from another.
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          id=$(printf '%s' "${TELEGRAM_APP_ID:-}" | tr -d '[:space:]')
          hash=$(printf '%s' "${TELEGRAM_APP_HASH:-}" | tr -d '[:space:]')
          [ -n "$id" ] && echo "TELEGRAM_APP_ID=$id" >> local.properties
          [ -n "$hash" ] && echo "TELEGRAM_APP_HASH=$hash" >> local.properties
          echo "local.properties written: sdk.dir, api id set=$([ -n "$id" ] && echo yes || echo no), hash set=$([ -n "$hash" ] && echo yes || echo no)"
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Assemble normal staging
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
          NFXP_BUILD_NUMBER: ${{ github.run_number }}
          # optional: your own api id / hash from my.telegram.org. Without them the build falls back to the
          # public Telegram Android id, and active sessions show the app as "Telegram Android".
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew TMessagesProj:assembleNormalStaging
      - name: Show the api id baked into this build
        # The id is not a secret (it travels in every request), the hash is, so only the id is shown.
        # build.gradle falls back to the repository pair whenever the environment variable is empty,
        # and that fallback is silent: reading the generated file is the only way to know what the
        # dex really carries. Failing here stops a release that nobody could sign in with.
        run: |
          set -euo pipefail
          f=$(find TMessagesProj/build/generated -name BuildConfig.java | head -1)
          echo "generated: $f"
          id=$(grep -oE 'int APP_ID = [0-9]+' "$f" | grep -oE '[0-9]+' || true)
          hash=$(grep -oE 'String APP_HASH = "[0-9a-f]+"' "$f" | grep -oE '[0-9a-f]{32}' || true)
          echo "settings in the generated file: id set=$([ -n "$id" ] && echo yes || echo no), hash set=$([ -n "$hash" ] && echo yes || echo no)"
          # Equality with the environment, not just "not the default": the two halves have to come
          # from the same place, or the app signs in with an id from one build and a hash from another
          [ "$id" = "${TELEGRAM_APP_ID:-}" ] || {
            echo "::error::APP_ID in the build does not match the secret"
            exit 1
          }
          [ "$hash" = "${TELEGRAM_APP_HASH:-}" ] || {
            echo "::error::APP_HASH in the build does not match the secret"
            exit 1
          }
          echo "build credentials match the secrets: id and hash both came from the same place"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NFX-Pad-normal-staging
          path: TMessagesProj/build/outputs/apk/normal/staging/
          if-no-files-found: warn
      - name: Publish release
        # Attaching the APKs to a release makes them downloadable without signing in to Actions.
        # Publishing straight from the runner avoids downloading the artifacts and uploading them again.
        # Runs after every successful build: the tag carries the run number, so each build gets its own.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base_version=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          version="${base_version}.dev.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, uploading into it"
          else
            gh release create "$tag" --title "NFX-Pad $version" --generate-notes --prerelease
          fi
          gh release upload "$tag" TMessagesProj/build/outputs/apk/normal/staging/*.apk --clobber
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NFX-Pad-build-reports
          path: |
            TMessagesProj/build/reports/
            TMessagesProj/build/outputs/logs/
          if-no-files-found: ignore
