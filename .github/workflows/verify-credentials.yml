name: Verify Telegram API credentials

# Standalone check for the api id / api hash used by the build. It is separate from the build
# workflow on purpose: the online part sends a real request to Telegram, which must never run as a
# side effect of an ordinary push.
#
# Run it by hand (Actions -> Verify Telegram API credentials -> Run workflow) after changing
# TELEGRAM_APP_ID / TELEGRAM_APP_HASH, before building a release.
#
# No value is ever printed: only lengths and verdicts, and the values are masked for the whole run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify credentials
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
    steps:
      - name: Check the shape of the secrets
        # Catches what the online check cannot report usefully: a missing secret, or a trailing
        # newline from a copy and paste, which turns a valid hash into "invalid hash id" at sign-in.
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          id="${TELEGRAM_APP_ID:-}"
          hash="${TELEGRAM_APP_HASH:-}"
          [ -n "$id" ] || fail "TELEGRAM_APP_ID is not set in Actions secrets"
          [ -n "$hash" ] || fail "TELEGRAM_APP_HASH is not set in Actions secrets"
          echo "::add-mask::$id"
          echo "::add-mask::$hash"
          [ "$id" = "$(printf '%s' "$id" | tr -d '[:space:]')" ] || fail "TELEGRAM_APP_ID contains whitespace"
          [ "$hash" = "$(printf '%s' "$hash" | tr -d '[:space:]')" ] || fail "TELEGRAM_APP_HASH contains whitespace"
          printf '%s' "$id" | grep -qE '^[0-9]{5,10}$' || fail "TELEGRAM_APP_ID is not a 5 to 10 digit number"
          printf '%s' "$hash" | grep -qE '^[0-9a-f]{32}$' || fail "TELEGRAM_APP_HASH is not 32 lowercase hex characters"
          if [ "$id" = "6" ] && [ "$hash" = "eb06d4abfb49dc3eeb1aeb98ae0f581e" ]; then
            fail "this is the public test pair that ships with the repository, so the secrets did not take effect"
          fi
          echo "shape ok: id ${#id} digits, hash ${#hash} hex characters"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install the MTProto client used by the check
        run: pip install --disable-pip-version-check telethon

      - name: Ask Telegram whether the pair is real
        # Two answers are needed, because Telegram checks them at different points:
        #   help.getConfig        - only api_id travels, so this proves the id exists and is not
        #                           blocked for being a widely used public id;
        #   auth.sendCode         - api_hash travels too, but it needs a phone number. A number that
        #                           cannot exist is used: if the pair is accepted the server moves on
        #                           to complain about the number, if it is not the server complains
        #                           about the id first. That difference is the proof.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import asyncio, os, sys
          from telethon import TelegramClient, functions
          from telethon.errors import (ApiIdInvalidError, ApiIdPublishedFloodError,
                                       FloodWaitError, RPCError)

          API_ID = int(os.environ["TELEGRAM_APP_ID"])
          API_HASH = os.environ["TELEGRAM_APP_HASH"]

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          async def main():
              # no session file of any use: this client never signs in, it only asks two questions
              client = TelegramClient("credential-check", API_ID, API_HASH)
              try:
                  await client.connect()
              except Exception as e:
                  fail(f"could not reach Telegram: {type(e).__name__}")

              # 1) does the api id exist and is it allowed
              try:
                  config = await client(functions.help.GetConfigRequest())
                  print(f"api id accepted by the server (this dc {config.this_dc})")
              except ApiIdInvalidError:
                  fail("api id is not valid: Telegram does not know it")
              except ApiIdPublishedFloodError:
                  fail("api id is blocked: it is a widely used public id, ask for your own at my.telegram.org")
              except FloodWaitError as e:
                  fail(f"Telegram asked to wait {e.seconds}s before answering, try again later")

              # 2) is the hash the one that belongs to this id
              try:
                  await client.send_code_request("+999999999999")
                  print("::warning::the server accepted a code request for an impossible number, "
                        "the hash result below is therefore not conclusive")
              except ApiIdInvalidError:
                  fail("api hash does not belong to this api id: Telegram rejected the pair")
              except ApiIdPublishedFloodError:
                  fail("api id is blocked: it is a widely used public id, ask for your own at my.telegram.org")
              except FloodWaitError as e:
                  fail(f"Telegram asked to wait {e.seconds}s before answering, try again later")
              except RPCError as e:
                  # every answer that is about the number means the credentials were accepted first;
                  # only an answer about the id would mean the pair is wrong, and that is caught above
                  name = type(e).__name__
                  if "PhoneNumber" in name:
                      print(f"api hash accepted: the server got past the credentials and rejected the "
                            f"number instead ({name}), so the pair is real")
                  else:
                      fail(f"unexpected answer while checking the pair: {name}: {e}")
              except Exception as e:
                  fail(f"could not check the pair: {type(e).__name__}: {e}")

              await client.disconnect()
              print("credential check passed")

          asyncio.run(main())
          PY
